{% if user.is_authenticated %}
<a class="button button-small button-quiet" href="{% url 'profile' %}">My Profile</a>
<form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="button button-small" type="submit" {% if demo_mode %}disabled{% endif %}>Logout</button></form>
{% else %}<a class="login-link" href="{% url 'login' %}">Log in</a><a class="button button-small" href="{% url 'register' %}">Sign Up <span aria-hidden="true">↗</span></a>{% endif %}
